<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON Гарант</title>
    <!-- Подключаем библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        h2 { text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--tg-theme-hint-color, #ccc);
            border-radius: 8px;
            background-color: var(--tg-theme-secondary-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Создать сделку</h2>
    
    <div class="input-group">
        <label>Сумма сделки (TON)</label>
        <input type="number" id="amount" placeholder="Например: 1.5" step="0.1">
    </div>

    <div class="input-group">
        <label>TON Кошелек продавца</label>
        <input type="text" id="address" placeholder="UQ...">
    </div>

    <button onclick="sendData()">Сформировать сделку</button>

    <script>
        // Инициализируем WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Открыть на весь экран

        function sendData() {
            let amount = document.getElementById("amount").value;
            let address = document.getElementById("address").value;

            if (!amount || !address) {
                tg.showAlert("Пожалуйста, заполните все поля!");
                return;
            }

            // Формируем JSON и отправляем в Python бота
            let data = {
                amount: amount,
                address: address
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
